name: Daily Market & Treasury Report

on:
  schedule:
    - cron: '0 23 * * *' # 한국 시간 오전 8시
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 모든 봇 실행에 필요한 라이브러리 통합 설치
          pip install yfinance requests pandas openpyxl matplotlib

      - name: Run all scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 국채 금리 리포트 실행
          python daily_bot.py
          # 2. 증시 분석 리포트 실행
          python market_report.py
          # 3. 누락 없는 엑셀 스냅샷 생성 및 전송
          python stock_snapshot.py
          # 4. 일일 주식 리포트 실행
          python daily_stock_report.py
