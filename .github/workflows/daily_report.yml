name: Daily Treasury Report

on:
  schedule:
    # 한국 시간(KST) 오전 8시는 UTC 기준 전날 23시입니다.
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼을 활성화합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 3.9 버전의 문법 에러를 방지하기 위해 3.10으로 설정

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib requests pandas

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_bot.py
