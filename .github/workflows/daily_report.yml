name: Daily Market & Treasury Report

on:
  schedule:
    # 한국 시간 오전 8시 = UTC 전날 23시
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 엑셀 생성을 위해 pandas와 openpyxl 설치 필수
          pip install yfinance requests pandas openpyxl 

      - name: Run all scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 국채 금리 리포트 실행
          python daily_bot.py
          # 2. 증시 리포트 실행
          python market_report.py
          # 3. 누락 데이터 포함 엑셀 파일 생성 및 전송 (핵심)
          python stock_snapshot.py
