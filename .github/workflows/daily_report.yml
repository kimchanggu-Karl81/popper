name: Daily Treasury Report

on:
  schedule:
    # cron: '분 시 일 월 요일' (UTC 기준)
    # 한국 시간 오전 8시 = UTC 23시 (0 23 * * *)
    - cron: '0 23 * * *'
  workflow_dispatch: # 버튼을 눌러 즉시 실행하는 기능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 3.9 에러 방지를 위해 3.10 이상 사용

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib requests pandas

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_bot.py
